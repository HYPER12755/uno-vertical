<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
	<defs>
		<linearGradient id="bg_wd6" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#1f1405" />
			<stop offset="100%" stop-color="#3d280a" />
		</linearGradient>
		<radialGradient id="wildbg_wd6" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#2c2c3d" />
			<stop offset="100%" stop-color="#0a0a0f" />
		</radialGradient>
		<filter id="glow_wd6" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="4" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
		<filter id="shadow_wd6" x="-10%" y="-10%" width="120%" height="120%">
			<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
		</filter>
	</defs>
	<!-- Card Outer Shape -->
	<rect x="2" y="2" width="196" height="296" rx="16" ry="16" fill="url(#bg_wd6)" stroke="#ff9100" stroke-width="3.5" />
	<rect x="7" y="7" width="186" height="286" rx="12" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5" />
	<rect x="11" y="11" width="178" height="278" rx="9" ry="9" fill="none" stroke="#ff9100" stroke-width="1" stroke-opacity="0.3" />
	<!-- Center Oval -->
	<ellipse cx="100" cy="150" rx="72" ry="105" transform="rotate(-28 100 150)" fill="url(#wildbg_wd6)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" filter="url(#shadow_wd6)" />
	<!-- Corner Pips -->
	<text x="14" y="32" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="23" text-anchor="left" fill="#ff9100" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">+6</text>
	<g transform="translate(186, 268) rotate(180)">
		<text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="23" text-anchor="left" fill="#ff9100" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">+6</text>
	</g>
	<!-- Central Artwork -->
	<g filter="url(#shadow_wd6)">
		<circle cx="100" cy="135" r="54" fill="none" stroke="#ff9100" stroke-width="4.5" opacity="0.9" filter="url(#glow_wd6)" />
		<text x="100" y="152" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="70" text-anchor="middle" fill="#ffffff" stroke="#e65100" stroke-width="3" filter="url(#glow_wd6)">+6</text>
		<rect x="35" y="182" width="130" height="24" rx="6" fill="#e65100" stroke="#ffb74d" stroke-width="1.5" />
		<text x="100" y="199" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#ffffff" letter-spacing="1.5">DRAW 6</text>
	</g>
</svg>
