<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  
  <defs>
    <linearGradient id="svg_teal_flip__bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011e21" />
      <stop offset="50%" stop-color="#033a40" />
      <stop offset="100%" stop-color="#011e21" />
    </linearGradient>

    <linearGradient id="svg_teal_flip__oval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33f3ff" />
      <stop offset="100%" stop-color="#009cb0" />
    </linearGradient>

    <radialGradient id="svg_teal_flip__wildbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e2e42" />
      <stop offset="100%" stop-color="#0a0a10" />
    </radialGradient>

    <linearGradient id="svg_teal_flip__gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="50%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>

    <linearGradient id="svg_teal_flip__flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <linearGradient id="svg_teal_flip__ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="50%" stop-color="#80deea" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>

    <filter id="svg_teal_flip__glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="svg_teal_flip__shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>
  
  
    <!-- Card Outer Boundary & Frame -->
    <rect x="2" y="2" width="196" height="296" rx="16" ry="16" fill="url(#svg_teal_flip__bg)" stroke="#00f0ff" stroke-width="3.5" />
    <rect x="7" y="7" width="186" height="286" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="11" y="11" width="178" height="278" rx="9" ry="9" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" />
  
  
      <ellipse cx="100" cy="150" rx="70" ry="105" transform="rotate(-28 100 150)" fill="url(#svg_teal_flip__oval)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" filter="url(#svg_teal_flip__shadow)" />
    
  
    <!-- Top-Left Corner Pip -->
    <text x="14" y="32" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="left" fill="#ffffff" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.85))">🌓</text>
    <!-- Bottom-Right Corner Pip (Rotated 180) -->
    <g transform="translate(186, 268) rotate(180)">
      <text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="left" fill="#ffffff" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.85))">🌓</text>
    </g>
  
  
      <g filter="url(#svg_teal_flip__shadow)">
        <g transform="translate(100, 136)">
          <path d="M -25 -25 A 36 36 0 0 1 25 -25 L 25 -38 L 45 -18 L 25 2 L 25 -12 A 22 22 0 0 0 -20 -12 Z" fill="#ffffff" />
          <path d="M 25 25 A 36 36 0 0 1 -25 25 L -25 38 L -45 18 L -25 -2 L -25 12 A 22 22 0 0 0 20 12 Z" fill="#ffffff" />
          <circle cx="0" cy="0" r="14" fill="#008b99" stroke="#ffffff" stroke-width="2" />
          <text x="0" y="5" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#ffffff">FLIP</text>
        </g>
        <rect x="35" y="184" width="130" height="24" rx="6" fill="#ffffff" />
        <text x="100" y="201" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#008b99" letter-spacing="1.5">FLIP SIDE</text>
      </g>
    
</svg>