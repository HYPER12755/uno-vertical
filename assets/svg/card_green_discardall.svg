<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  
  <defs>
    <linearGradient id="svg_green_discardall__bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f0c" />
      <stop offset="50%" stop-color="#093d18" />
      <stop offset="100%" stop-color="#041f0c" />
    </linearGradient>

    <linearGradient id="svg_green_discardall__oval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd964" />
      <stop offset="100%" stop-color="#1b9438" />
    </linearGradient>

    <radialGradient id="svg_green_discardall__wildbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e2e42" />
      <stop offset="100%" stop-color="#0a0a10" />
    </radialGradient>

    <linearGradient id="svg_green_discardall__gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="50%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </linearGradient>

    <linearGradient id="svg_green_discardall__flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>

    <linearGradient id="svg_green_discardall__ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" />
      <stop offset="50%" stop-color="#80deea" />
      <stop offset="100%" stop-color="#00acc1" />
    </linearGradient>

    <filter id="svg_green_discardall__glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="svg_green_discardall__shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>
  
  
    <!-- Card Outer Boundary & Frame -->
    <rect x="2" y="2" width="196" height="296" rx="16" ry="16" fill="url(#svg_green_discardall__bg)" stroke="#34c759" stroke-width="3.5" />
    <rect x="7" y="7" width="186" height="286" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" />
    <rect x="11" y="11" width="178" height="278" rx="9" ry="9" fill="none" stroke="#34c759" stroke-width="1" stroke-opacity="0.25" />
  
  
      <ellipse cx="100" cy="150" rx="70" ry="105" transform="rotate(-28 100 150)" fill="url(#svg_green_discardall__oval)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" filter="url(#svg_green_discardall__shadow)" />
    
  
    <!-- Top-Left Corner Pip -->
    <text x="14" y="32" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="left" fill="#ffffff" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.85))">⬇</text>
    <!-- Bottom-Right Corner Pip (Rotated 180) -->
    <g transform="translate(186, 268) rotate(180)">
      <text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="left" fill="#ffffff" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.85))">⬇</text>
    </g>
  
  
      <g filter="url(#svg_green_discardall__shadow)">
        <g transform="translate(100, 118)">
          <rect x="-14" y="-22" width="28" height="40" rx="3" fill="#ffffff" opacity="0.5" transform="rotate(-20)" />
          <rect x="-14" y="-22" width="28" height="40" rx="3" fill="#ffffff" opacity="0.75" transform="rotate(20)" />
          <rect x="-14" y="-22" width="28" height="40" rx="3" fill="#ffffff" stroke="#1e8238" stroke-width="1.5" />
          <path d="M 0 -8 L 0 8 M -6 2 L 0 8 L 6 2" stroke="#1e8238" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <rect x="25" y="158" width="150" height="28" rx="6" fill="#ffffff" />
        <text x="100" y="177" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#1e8238" letter-spacing="1">DISCARD ALL</text>
      </g>
    
</svg>