<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
	<defs>
		<linearGradient id="bg_skpb" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#041021" />
			<stop offset="100%" stop-color="#071f3f" />
		</linearGradient>
		<linearGradient id="oval_skpb" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#33baff" />
			<stop offset="100%" stop-color="#0066cc" />
		</linearGradient>
		<filter id="shadow_skpb" x="-10%" y="-10%" width="120%" height="120%">
			<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
		</filter>
	</defs>
	<!-- Card Outer Shape -->
	<rect x="2" y="2" width="196" height="296" rx="16" ry="16" fill="url(#bg_skpb)" stroke="#00a8ff" stroke-width="3.5" />
	<rect x="7" y="7" width="186" height="286" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5" />
	<rect x="11" y="11" width="178" height="278" rx="9" ry="9" fill="none" stroke="#00a8ff" stroke-width="1" stroke-opacity="0.3" />
	<!-- Center Oval -->
	<ellipse cx="100" cy="150" rx="70" ry="105" transform="rotate(-28 100 150)" fill="url(#oval_skpb)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85" filter="url(#shadow_skpb)" />
	<!-- Corner Pips -->
	<text x="14" y="32" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="18" text-anchor="left" fill="#ffffff" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">⊘⊘</text>
	<g transform="translate(186, 268) rotate(180)">
		<text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="18" text-anchor="left" fill="#ffffff" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">⊘⊘</text>
	</g>
	<!-- Central Artwork -->
	<g filter="url(#shadow_skpb)">
		<g transform="translate(76, 125)">
			<circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="5" />
			<line x1="-15" y1="-15" x2="15" y2="15" stroke="#ffffff" stroke-width="5" />
		</g>
		<g transform="translate(124, 125)">
			<circle cx="0" cy="0" r="22" fill="none" stroke="#ffffff" stroke-width="5" />
			<line x1="-15" y1="-15" x2="15" y2="15" stroke="#ffffff" stroke-width="5" />
		</g>
		<rect x="35" y="162" width="130" height="24" rx="6" fill="#ffffff" />
		<text x="100" y="179" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#005bb5" letter-spacing="1">SKIP ALL</text>
	</g>
</svg>
