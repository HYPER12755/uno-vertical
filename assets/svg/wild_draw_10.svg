<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
	<defs>
		<linearGradient id="bg_wd10" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#200508" />
			<stop offset="100%" stop-color="#3a090e" />
		</linearGradient>
		<radialGradient id="wildbg_wd10" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#2c2c3d" />
			<stop offset="100%" stop-color="#0a0a0f" />
		</radialGradient>
		<linearGradient id="flame_wd10" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ff0055" />
			<stop offset="50%" stop-color="#ff5500" />
			<stop offset="100%" stop-color="#ffcc00" />
		</linearGradient>
		<filter id="glow_wd10" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="4" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
		<filter id="shadow_wd10" x="-10%" y="-10%" width="120%" height="120%">
			<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
		</filter>
	</defs>
	<!-- Card Outer Shape -->
	<rect x="2" y="2" width="196" height="296" rx="16" ry="16" fill="url(#bg_wd10)" stroke="#ff007f" stroke-width="3.5" />
	<rect x="7" y="7" width="186" height="286" rx="12" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5" />
	<rect x="11" y="11" width="178" height="278" rx="9" ry="9" fill="none" stroke="#ff007f" stroke-width="1" stroke-opacity="0.3" />
	<!-- Center Oval -->
	<ellipse cx="100" cy="150" rx="72" ry="105" transform="rotate(-28 100 150)" fill="url(#wildbg_wd10)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" filter="url(#shadow_wd10)" />
	<!-- Corner Pips -->
	<text x="14" y="32" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="left" fill="#ff3344" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">+10</text>
	<g transform="translate(186, 268) rotate(180)">
		<text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="left" fill="#ff3344" filter="drop-shadow(1px 2px 2px rgba(0,0,0,0.8))">+10</text>
	</g>
	<!-- Central Artwork -->
	<g filter="url(#shadow_wd10)">
		<circle cx="100" cy="135" r="58" fill="none" stroke="url(#flame_wd10)" stroke-width="5" opacity="0.9" filter="url(#glow_wd10)" />
		<text x="100" y="148" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#ffffff" stroke="#d6001c" stroke-width="3" filter="url(#glow_wd10)">+10</text>
		<rect x="30" y="180" width="140" height="26" rx="6" fill="#d6001c" stroke="#ff8080" stroke-width="1.5" />
		<text x="100" y="198" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#ffffff" letter-spacing="1.5">💥 NO MERCY</text>
	</g>
</svg>
