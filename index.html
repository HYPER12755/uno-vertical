        <script>
            window.showPlayerReaction = function(playerIndex, emoji) {
                var c = document.getElementById('canvasHolder');
                if (!c) return;
                var el = document.createElement('div');
                el.innerText = emoji;
                el.style.position = 'absolute';
                el.style.fontSize = '40px';
                el.style.zIndex = '200';
                el.style.pointerEvents = 'none';
                el.style.animation = 'fc-float-up 1.5s ease-out forwards';
                
                // approximate positions for up to 4 players based on JS coordinates in game.js
                // P0 = bottom center
                // P1 = top center (if 2 players) or left side (if 4)
                // P2 = top center
                // P3 = right side
                var activePlayers = (window.gameData && window.gameData.activePlayers) || 2;
                var left = '50%', top = '50%';
                if (playerIndex === 0) { left = '50%'; top = '80%'; }
                else if (playerIndex === 1) { 
                    if (activePlayers === 2) { left = '50%'; top = '15%'; }
                    else { left = '15%'; top = '50%'; }
                }
                else if (playerIndex === 2) { left = '50%'; top = '15%'; }
                else if (playerIndex === 3) { left = '85%'; top = '50%'; }
                
                el.style.left = left;
                el.style.top = top;
                el.style.transform = 'translate(-50%, -50%)';
                
                c.appendChild(el);
                setTimeout(function(){ el.remove(); }, 1500);
            };

            // Inject keyframes for animation
            var style = document.createElement('style');
            style.innerHTML = `
            @keyframes fc-float-up {
                0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
                20% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
                80% { opacity: 1; transform: translate(-50%, -120%) scale(1); }
                100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
            }`;
            document.head.appendChild(style);
        </script>
